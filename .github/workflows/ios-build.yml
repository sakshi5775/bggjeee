name: Mobile Build (Android + iOS dSYM to Crashlytics)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Avoid Node.js 20 deprecation warning (actions will use Node 24)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  android:
    name: Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true

      - name: Create android/local.properties (required by settings.gradle.kts)
        run: |
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Android APK (release)
        run: flutter build apk --release --build-number ${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

  ios:
    name: iOS Release Archive + dSYM Upload
    runs-on: macos-latest
    env:
      # Required for Crashlytics to accept dSYM uploads (run: firebase login:ci)
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      # Required for iOS archive + dSYM (Apple Team ID from https://developer.apple.com/account#MembershipDetailsCard)
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile', 'pubspec.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Generate Flutter iOS config (required before pod install)
        run: flutter build ios --config-only --release --no-codesign

      - name: Generate ios/firebase_app_id_file.json for Crashlytics
        run: |
          set -euo pipefail
          GSP_PATH="ios/Runner/GoogleService-Info.plist"
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :GOOGLE_APP_ID" "$GSP_PATH")
          PROJECT_ID=$(/usr/libexec/PlistBuddy -c "Print :PROJECT_ID" "$GSP_PATH")
          # Write valid JSON (\n in printf format = real newline; literal '\n' as argument would break Crashlytics).
          printf '{ "GOOGLE_APP_ID": "%s", "FIREBASE_PROJECT_ID": "%s" }\n' "$APP_ID" "$PROJECT_ID" > ios/firebase_app_id_file.json
          echo "Generated ios/firebase_app_id_file.json"
          cat ios/firebase_app_id_file.json

      - name: Install CocoaPods properly
        run: |
          set -e
          sudo gem install cocoapods
          cd ios
          pod repo update
          pod install --repo-update

      - name: Verify GoogleService-Info.plist
        run: |
          test -f ios/Runner/GoogleService-Info.plist

      - name: Build iOS archive or build (Release)
        run: |
          set -e
          IOS_WORKSPACE="ios/Runner.xcworkspace"
          IOS_SCHEME="Runner"
          ARCHIVE_PATH="ios/build/Runner.xcarchive"
          DERIVED_DATA="ios/build/DerivedData"

          mkdir -p ios/build
          APP_VERSION_NAME=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+[0-9]*$//' | tr -d ' ')
          if [[ -z "$APP_VERSION_NAME" ]]; then echo "::error::Could not find version in pubspec.yaml"; exit 1; fi

          # Try archive only if DEVELOPMENT_TEAM is set (CI has no Apple account/profiles, so archive usually fails)
          if [[ -n "$DEVELOPMENT_TEAM" ]]; then
            echo "Trying code-signed archive..."
            if xcodebuild archive \
              -workspace "$IOS_WORKSPACE" \
              -scheme "$IOS_SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$ARCHIVE_PATH" \
              -destination 'generic/platform=iOS' \
              -allowProvisioningUpdates \
              DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              MARKETING_VERSION="$APP_VERSION_NAME" \
              CURRENT_PROJECT_VERSION=${{ github.run_number }}; then
              echo "Archive succeeded."
            else
              echo "::warning::Archive failed (CI has no Apple account/provisioning profiles). Falling back to build without signing to get dSYMs for Crashlytics."
            fi
          fi

          # If no archive (or not tried), do a build without signing so we still get dSYMs for Crashlytics
          if [[ ! -d "$ARCHIVE_PATH" ]]; then
            echo "Building without code signing (dSYMs will be in DerivedData)..."
            xcodebuild build \
              -workspace "$IOS_WORKSPACE" \
              -scheme "$IOS_SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$DERIVED_DATA" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              MARKETING_VERSION="$APP_VERSION_NAME" \
              CURRENT_PROJECT_VERSION=${{ github.run_number }}
            echo "Build finished. dSYMs will be under $DERIVED_DATA/Build/Products/Release-iphoneos/"
          fi

      - name: Debug build output + dSYM locations
        run: |
          set -e
          ARCHIVE_PATH="ios/build/Runner.xcarchive"
          DERIVED_DSYM_ROOT="ios/build/DerivedData/Build/Products/Release-iphoneos"
          if [[ -d "$ARCHIVE_PATH" ]]; then
            echo "Archive present: $ARCHIVE_PATH"
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$ARCHIVE_PATH/Info.plist" 2>/dev/null || true
            ls -la "$ARCHIVE_PATH/dSYMs" 2>/dev/null || true
          fi
          echo "Checking DerivedData dSYMs:"
          find "$DERIVED_DSYM_ROOT" -name "*.dSYM" -type d 2>/dev/null | head -20 || true

      - name: (Optional) Generate .dart_tools flutterfire file for Crashlytics
        run: |
          set -euo pipefail
          GSP_PATH="ios/Runner/GoogleService-Info.plist"
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :GOOGLE_APP_ID" "$GSP_PATH")
          PROJECT_ID=$(/usr/libexec/PlistBuddy -c "Print :PROJECT_ID" "$GSP_PATH")
          TARGET_DIR=".dart_tools/flutterfire/ios/default"
          TARGET_FILE="$TARGET_DIR/firebase_app_id_file.json"
          mkdir -p "$TARGET_DIR"
          printf '{ "GOOGLE_APP_ID": "%s", "FIREBASE_PROJECT_ID": "%s" }\n' "$APP_ID" "$PROJECT_ID" > "$TARGET_FILE"
          echo "Generated $TARGET_FILE"

      - name: Collect dSYMs from archive or DerivedData
        run: |
          set -e
          DSYM_OUT="ios/build/dSYMs_collected"
          mkdir -p "$DSYM_OUT"
          for root in ios/build/Runner.xcarchive "ios/build/DerivedData/Build/Products/Release-iphoneos"; do
            [[ ! -d "$root" ]] && continue
            while IFS= read -r dsym; do
              [[ -z "$dsym" ]] && continue
              cp -R "$dsym" "$DSYM_OUT/" 2>/dev/null || true
            done < <(find "$root" -name "*.dSYM" -type d 2>/dev/null)
          done
          echo "Collected dSYMs:"
          ls -la "$DSYM_OUT" 2>/dev/null || true

      - name: Create dsym.zip for manual upload
        run: |
          if [[ -d "ios/build/dSYMs_collected" ]] && [[ -n "$(ls -A ios/build/dSYMs_collected 2>/dev/null)" ]]; then
            cd ios/build && zip -r ../../dsym.zip dSYMs_collected && cd ../..
            echo "Created dsym.zip (use in Firebase Console > Crashlytics > dSYMs > Upload)."
            ls -la dsym.zip
          else
            echo "::warning::No dSYMs collected; skipping dsym.zip."
          fi

      - name: Upload dSYM as GitHub artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ios-dSYMs
          path: ios/build/dSYMs_collected
          if-no-files-found: warn

      - name: Upload dsym.zip (for manual Firebase upload)
        uses: actions/upload-artifact@v4
        with:
          name: dsym-zip-build-${{ github.run_number }}
          path: dsym.zip
          if-no-files-found: warn

      - name: Locate upload-symbols and upload dSYM to Crashlytics
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          GSP="ios/Runner/GoogleService-Info.plist"
          # dSYMs can be in archive (code-signed build) or in DerivedData (no-signing build)
          DSYM_LIST=$(find ios/build/Runner.xcarchive ios/build/DerivedData/Build/Products/Release-iphoneos ios/build/dSYMs_collected -name "*.dSYM" -type d 2>/dev/null || true)
          DSYM_LIST=$(echo "$DSYM_LIST" | sort -u)
          if [[ -z "$DSYM_LIST" ]]; then
            echo "::warning::No dSYM files found; skipping Crashlytics upload."
            exit 0
          fi
          echo "Found dSYMs to upload:"
          echo "$DSYM_LIST"

          UPLOAD_SYMBOLS=$(find ios/Pods -name 'upload-symbols' -type f 2>/dev/null | head -1)
          if [[ -z "$UPLOAD_SYMBOLS" || ! -f "$UPLOAD_SYMBOLS" ]]; then
            echo "::error::upload-symbols not found under ios/Pods"
            find ios/Pods -type f -name '*.py' 2>/dev/null | head -5 || true
            exit 1
          fi
          chmod +x "$UPLOAD_SYMBOLS"
          echo "Using: $UPLOAD_SYMBOLS"

          if [[ -z "$FIREBASE_TOKEN" ]]; then
            echo "::warning::FIREBASE_TOKEN secret not set; add it in repo Settings > Secrets for Crashlytics to accept uploads."
          fi

          COUNT=0
          while IFS= read -r dsym; do
            [[ -z "$dsym" ]] && continue
            echo "Uploading: $dsym"
            "$UPLOAD_SYMBOLS" -gsp "$GSP" -p ios "$dsym" && COUNT=$((COUNT + 1)) || true
          done <<< "$DSYM_LIST"
          echo "Crashlytics dSYM upload finished ($COUNT dSYM(s) uploaded)."

