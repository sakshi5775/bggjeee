name: Mobile Build (Android + iOS dSYM to Crashlytics)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Android APK (release)
        run: flutter build apk --release --build-number ${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

  ios:
    name: iOS Release Archive + dSYM Upload
    runs-on: macos-latest
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Install CocoaPods properly
        run: |
          set -e
          sudo gem install cocoapods
          cd ios
          pod repo update
          pod install --repo-update

      - name: Verify GoogleService-Info.plist
        run: |
          test -f ios/Runner/GoogleService-Info.plist

      - name: Build iOS archive (Release, no code signing)
        run: |
          set -e
          IOS_WORKSPACE="ios/Runner.xcworkspace"
          IOS_SCHEME="Runner"
          ARCHIVE_PATH="ios/build/Runner.xcarchive"
          DSYM_PATH="ios/build/Runner.xcarchive/dSYMs"

          mkdir -p "$(dirname "$ARCHIVE_PATH")"

          APP_VERSION_NAME=$(python3 - <<'PY'
import re
txt=open('pubspec.yaml','r',encoding='utf-8').read()
m=re.search(r'^version:\\s*([^\\n]+)$',txt, re.M)
if not m:
    raise SystemExit("Could not find version in pubspec.yaml")
v=m.group(1).strip()
# pubspec version looks like 1.0.1+59; we want only 1.0.1
print(v.split('+')[0])
PY
          )

          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            MARKETING_VERSION="$APP_VERSION_NAME" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

          test -d "$DSYM_PATH"

      - name: Debug archive version + dSYM folder
        run: |
          set -e
          ARCHIVE_PATH="ios/build/Runner.xcarchive"
          DSYM_PATH="ios/build/Runner.xcarchive/dSYMs"
          echo "CFBundleShortVersionString:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$ARCHIVE_PATH/Info.plist" || true
          echo "CFBundleVersion (build number):"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$ARCHIVE_PATH/Info.plist" || true
          echo "Listing dSYMs:"
          ls -la "$DSYM_PATH"
          # Print one dSYM sample if present
          ls -la "$DSYM_PATH"/*.dSYM 2>/dev/null || true

      - name: Upload dSYM as GitHub artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-dSYMs
          path: ios/build/Runner.xcarchive/dSYMs
          if-no-files-found: error

      - name: Check upload-symbols exists
        run: |
          set -e
          ls -la ios/Pods/FirebaseCrashlytics
          test -f ios/Pods/FirebaseCrashlytics/upload-symbols

      - name: Upload dSYM to Firebase Crashlytics
        run: |
          set -euo pipefail
          chmod +x ios/Pods/FirebaseCrashlytics/upload-symbols
          ios/Pods/FirebaseCrashlytics/upload-symbols \
            -gsp ios/Runner/GoogleService-Info.plist \
            -p ios ios/build/Runner.xcarchive/dSYMs

