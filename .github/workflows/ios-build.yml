name: Mobile Build (Android + iOS dSYM to Crashlytics)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true

      - name: Create android/local.properties (required by settings.gradle.kts)
        run: |
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Android APK (release)
        run: flutter build apk --release --build-number ${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

  ios:
    name: iOS Release Archive + dSYM Upload
    runs-on: macos-latest
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      # Set DEVELOPMENT_TEAM in repo secrets if archive fails with code-signing errors
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate Flutter iOS config (required before pod install)
        run: flutter build ios --config-only --release --no-codesign

      - name: Generate ios/firebase_app_id_file.json for Crashlytics
        run: |
          set -euo pipefail
          GSP_PATH="ios/Runner/GoogleService-Info.plist"
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :GOOGLE_APP_ID" "$GSP_PATH")
          PROJECT_ID=$(/usr/libexec/PlistBuddy -c "Print :PROJECT_ID" "$GSP_PATH")
          # Write valid JSON (\n in printf format = real newline; literal '\n' as argument would break Crashlytics).
          printf '{ "GOOGLE_APP_ID": "%s", "FIREBASE_PROJECT_ID": "%s" }\n' "$APP_ID" "$PROJECT_ID" > ios/firebase_app_id_file.json
          echo "Generated ios/firebase_app_id_file.json"
          cat ios/firebase_app_id_file.json

      - name: Install CocoaPods properly
        run: |
          set -e
          sudo gem install cocoapods
          cd ios
          pod repo update
          pod install --repo-update

      - name: Verify GoogleService-Info.plist
        run: |
          test -f ios/Runner/GoogleService-Info.plist

      - name: Build iOS archive (Release)
        run: |
          set -e
          IOS_WORKSPACE="ios/Runner.xcworkspace"
          IOS_SCHEME="Runner"
          ARCHIVE_PATH="ios/build/Runner.xcarchive"
          DSYM_PATH="ios/build/Runner.xcarchive/dSYMs"

          mkdir -p "$(dirname "$ARCHIVE_PATH")"

          APP_VERSION_NAME=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+[0-9]*$//' | tr -d ' ')
          if [[ -z "$APP_VERSION_NAME" ]]; then echo "::error::Could not find version in pubspec.yaml"; exit 1; fi

          if [[ -n "$DEVELOPMENT_TEAM" ]]; then
            echo "Building with DEVELOPMENT_TEAM for code signing..."
            xcodebuild archive \
              -workspace "$IOS_WORKSPACE" \
              -scheme "$IOS_SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$ARCHIVE_PATH" \
              -destination 'generic/platform=iOS' \
              -allowProvisioningUpdates \
              DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              MARKETING_VERSION="$APP_VERSION_NAME" \
              CURRENT_PROJECT_VERSION=${{ github.run_number }}
          else
            echo "Building without code signing (set DEVELOPMENT_TEAM secret if archive fails)..."
            xcodebuild archive \
              -workspace "$IOS_WORKSPACE" \
              -scheme "$IOS_SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$ARCHIVE_PATH" \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              MARKETING_VERSION="$APP_VERSION_NAME" \
              CURRENT_PROJECT_VERSION=${{ github.run_number }}
          fi

          if [[ ! -d "$ARCHIVE_PATH" ]]; then
            echo "::warning::Archive not found at $ARCHIVE_PATH (Xcode often skips creating .xcarchive when CODE_SIGNING_ALLOWED=NO). Add DEVELOPMENT_TEAM secret for a full archive + dSYM."
            exit 0
          fi
          if [[ ! -d "$DSYM_PATH" ]]; then echo "::warning::dSYM directory not found at $DSYM_PATH (can happen when building without code signing); later upload steps may skip."; fi

      - name: Debug archive version + dSYM folder
        run: |
          set -e
          ARCHIVE_PATH="ios/build/Runner.xcarchive"
          DSYM_PATH="ios/build/Runner.xcarchive/dSYMs"
          if [[ ! -d "$ARCHIVE_PATH" ]]; then echo "Skipping (no archive from build step)."; exit 0; fi
          echo "CFBundleShortVersionString:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$ARCHIVE_PATH/Info.plist" || true
          echo "CFBundleVersion (build number):"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$ARCHIVE_PATH/Info.plist" || true
          echo "Listing dSYMs:"
          ls -la "$DSYM_PATH" 2>/dev/null || echo "(dSYM folder missing or empty)"
          # Print one dSYM sample if present
          ls -la "$DSYM_PATH"/*.dSYM 2>/dev/null || true

      - name: (Optional) Generate .dart_tools flutterfire file for Crashlytics
        run: |
          set -euo pipefail
          GSP_PATH="ios/Runner/GoogleService-Info.plist"
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :GOOGLE_APP_ID" "$GSP_PATH")
          PROJECT_ID=$(/usr/libexec/PlistBuddy -c "Print :PROJECT_ID" "$GSP_PATH")
          TARGET_DIR=".dart_tools/flutterfire/ios/default"
          TARGET_FILE="$TARGET_DIR/firebase_app_id_file.json"
          mkdir -p "$TARGET_DIR"
          printf '{ "GOOGLE_APP_ID": "%s", "FIREBASE_PROJECT_ID": "%s" }\n' "$APP_ID" "$PROJECT_ID" > "$TARGET_FILE"
          echo "Generated $TARGET_FILE"

      - name: Upload dSYM as GitHub artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ios-dSYMs
          path: ios/build/Runner.xcarchive/dSYMs
          if-no-files-found: warn

      - name: Locate upload-symbols and upload dSYM to Crashlytics
        run: |
          set -euo pipefail
          DSYM_DIR="ios/build/Runner.xcarchive/dSYMs"
          GSP="ios/Runner/GoogleService-Info.plist"

          if [[ ! -d "$DSYM_DIR" ]] || [[ -z "$(ls -A "$DSYM_DIR" 2>/dev/null)" ]]; then
            echo "::warning::dSYM directory missing or empty; skipping Crashlytics upload."
            exit 0
          fi

          UPLOAD_SYMBOLS=$(find ios/Pods -name 'upload-symbols' -type f 2>/dev/null | head -1)
          if [[ -z "$UPLOAD_SYMBOLS" || ! -f "$UPLOAD_SYMBOLS" ]]; then
            echo "::error::upload-symbols not found under ios/Pods"
            find ios/Pods -type f -name '*.py' 2>/dev/null | head -5 || true
            exit 1
          fi
          chmod +x "$UPLOAD_SYMBOLS"
          echo "Using: $UPLOAD_SYMBOLS"

          if [[ -z "$FIREBASE_TOKEN" ]]; then
            echo "::warning::FIREBASE_TOKEN secret not set; Crashlytics upload may fail."
          fi

          "$UPLOAD_SYMBOLS" \
            -gsp "$GSP" \
            -p ios \
            "$DSYM_DIR"
          echo "Crashlytics dSYM upload finished."

