name: Mobile Build (Android + iOS dSYM to Crashlytics)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Android APK (release)
        run: flutter build apk --release --build-number ${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

  ios:
    name: iOS Release Archive + dSYM Upload
    runs-on: macos-latest
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: CocoaPods install (with retry)
        run: |
          set -e
          cd ios
          pod install --repo-update || {
            echo "pod install failed. Installing/repairing CocoaPods..."
            sudo gem install cocoapods
            pod install --repo-update
          }

      - name: Verify GoogleService-Info.plist
        run: |
          test -f ios/Runner/GoogleService-Info.plist

      - name: Build iOS archive (Release, no code signing)
        run: |
          set -e
          IOS_WORKSPACE="ios/Runner.xcworkspace"
          IOS_SCHEME="Runner"
          ARCHIVE_PATH="ios/build/Runner.xcarchive"
          DSYM_PATH="ios/build/Runner.xcarchive/dSYMs"

          mkdir -p "$(dirname "$ARCHIVE_PATH")"

          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

          test -d "$DSYM_PATH"

      - name: Upload dSYM as GitHub artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-dSYMs
          path: ios/build/Runner.xcarchive/dSYMs
          if-no-files-found: error

      - name: Upload dSYMs to Firebase Crashlytics
        run: |
          set -e

          DSYM_PATH="ios/build/Runner.xcarchive/dSYMs"
          GSP_PATH="ios/Runner/GoogleService-Info.plist"
          UPLOAD_SYMBOLS_SCRIPT="ios/Pods/FirebaseCrashlytics/upload-symbols"

          IOS_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :GOOGLE_APP_ID" "$GSP_PATH" || true)
          if [ -z "$IOS_APP_ID" ]; then
            echo "Could not read GOOGLE_APP_ID from $GSP_PATH"
            exit 1
          fi

          if [ -f "$UPLOAD_SYMBOLS_SCRIPT" ]; then
            echo "Uploading using upload-symbols script..."
            chmod +x "$UPLOAD_SYMBOLS_SCRIPT"
            "$UPLOAD_SYMBOLS_SCRIPT" -gsp "$GSP_PATH" -p ios "$DSYM_PATH" || {
              echo "upload-symbols failed; will fall back to firebase-tools"
            }
          else
            echo "upload-symbols script not found at: $UPLOAD_SYMBOLS_SCRIPT"
          fi

          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN secret is missing. Cannot upload symbols to Crashlytics."
            exit 1
          fi

          if ! command -v firebase >/dev/null 2>&1; then
            echo "Installing firebase-tools..."
            npm i -g firebase-tools
          fi

          echo "Uploading using firebase-tools..."
          firebase crashlytics:symbols:upload --app "$IOS_APP_ID" "$DSYM_PATH" --debug

