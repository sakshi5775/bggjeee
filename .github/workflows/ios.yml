name: iOS Deep Debug

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code (IMPORTANT)
        run: flutter analyze --no-fatal-infos || true

      - name: Run Dart Checks
        run: dart fix --dry-run || true

      - name: Clean Build
        run: flutter clean

      - name: Regenerate dependencies after clean
        run: flutter pub get

      - name: Install Pods (with retry)
        run: |
          cd ios
          for i in {1..3}; do
            echo "Attempt $i of 3..."
            pod install --repo-update && break || {
              if [ $i -lt 3 ]; then
                echo "Pod install failed, retrying in 10 seconds..."
                sleep 10
              else
                echo "Pod install failed after 3 attempts"
                exit 1
              fi
            }
          done

      - name: Build iOS (Verbose)
        run: flutter build ios --no-codesign -v

      - name: Upload iOS App Binary
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-binary
          path: build/ios/iphoneos/Runner.app
          retention-days: 7
