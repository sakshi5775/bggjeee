name: iOS Deep Debug

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code (IMPORTANT)
        run: flutter analyze

      - name: Run Dart Checks
        run: dart fix --dry-run

      - name: Clean Build
        run: flutter clean

      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS (Verbose)
        run: flutter build ios --no-codesign -v
